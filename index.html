<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovelArchitect AI - 小说创作系统</title>
    
    <link rel="manifest" href="#manifest-placeholder">
    <meta name="theme-color" content="#020617">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小说AI">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Urbanist', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* 侧边导航栏适配移动端 */
        aside {
            width: 260px;
            background-color: #020617;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: #a3e635; }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #1e293b;
            color: #a3e635;
        }

        /* 主工作区 */
        main {
            flex-grow: 1;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: #020617;
        }

        .workspace-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }
        .workspace-content.active {
            display: flex;
            flex-direction: column;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #a3e635;
            color: #020617;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        textarea.editor {
            flex-grow: 1;
            resize: none;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            color: #f8fafc;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
            min-height: 300px;
        }

        .studio-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            height: 100%;
        }
        @media (min-width: 768px) {
            .studio-layout { grid-template-columns: 2fr 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <i class="fa-solid fa-feather-pointed" style="color: #a3e635;"></i> 小说AI <span>PWA</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="switchTab('studio', this)">
                <i class="fa-solid fa-pen-nib"></i> 写作工作台
            </li>
            <li class="nav-item" onclick="switchTab('bible', this)">
                <i class="fa-solid fa-book-atlas"></i> 设定集 (Bible)
            </li>
            <li class="nav-item" onclick="switchTab('router', this)">
                <i class="fa-solid fa-network-wired"></i> 模型网关
            </li>
        </ul>
        <div style="font-size: 12px; color: #64748b; text-align: center;">
            PWA 离线就绪
        </div>
    </aside>

    <main>
        <header>
            <div id="header-title" style="font-weight: 700; font-size: 18px;">第一章 虚空之门</div>
            <button class="btn" onclick="triggerAIGeneration()">AI 续写</button>
        </header>

        <div id="tab-studio" class="workspace-content active">
            <div class="studio-layout">
                <div style="display:flex; flex-direction:column; height:100%;">
                    <textarea class="editor" id="draft-editor">寒风掠过瓦伦西亚的玄武岩尖塔，空气中弥漫着臭氧与古老秘术的味道。卡兰紧紧握住护符，感受着它与心跳同步的律动。眼前的传送门闪烁着幽紫色的微光，隐约透出消逝纪元的碎片。</textarea>
                </div>
                <div class="card">
                    <h3 style="margin-top:0; color:#a3e635;">向量 RAG 实体记忆</h3>
                    <p style="font-size:13px; color:#94a3b8;">自动防吃书对齐：</p>
                    <div style="background:#020617; border-left:3px solid #a3e635; padding:10px; border-radius:6px; margin-bottom:8px; font-size:14px;">
                        <strong>卡兰</strong>：主角，银瞳编织者
                    </div>
                    <div style="background:#020617; border-left:3px solid #a3e635; padding:10px; border-radius:6px; font-size:14px;">
                        <strong>护符</strong>：具有心跳同频能力的遗物
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-bible" class="workspace-content">
            <h2 style="margin-top:0;">世界观 Bible 知识图谱</h2>
            <div class="card">
                <h3 style="color:#a3e635;">核心人物 (12)</h3>
                <p style="font-size:14px; color:#94a3b8;">实时管理角色性格、成长轨迹与阵营关系。</p>
            </div>
            <div class="card">
                <h3 style="color:#a3e635;">地理与势力 (8)</h3>
                <p style="font-size:14px; color:#94a3b8;">宗门、秘境、历史背景向量化入库。</p>
            </div>
        </div>

        <div id="tab-router" class="workspace-content">
            <h2 style="margin-top:0;">多模型网关 (LiteLLM)</h2>
            <div class="card">
                <h3>大纲推理: DeepSeek-R1</h3>
                <p style="font-size:14px; color:#94a3b8;">负责高逻辑、多卷宏大叙事推演。</p>
            </div>
            <div class="card">
                <h3>正文续写: Claude 3.5 Sonnet</h3>
                <p style="font-size:14px; color:#94a3b8;">负责沉浸式文笔、细腻情感和爽点爆发。</p>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.workspace-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');

            const titles = {
                'studio': '第一章 虚空之门',
                'bible': '世界观设定集 (Bible)',
                'router': '多模型网关配置'
            };
            document.getElementById('header-title').innerText = titles[tabId];
        }

        function triggerAIGeneration() {
            const editor = document.getElementById('draft-editor');
            editor.value += "\n\n随着大门缓缓开启，低沉的轰鸣声在地砖下回荡。卡兰向前踏出一步，目光坚毅地迎向未知的前方。";
            alert("AI 网关调用成功：已自动结合 RAG 设定集完成正文续写！");
        }

        // 动态生成并注入 PWA 的 Manifest 属性（免去单独建文件的麻烦）
        const manifestData = {
            "name": "NovelArchitect AI",
            "short_name": "小说AI",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#020617",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3076/3076753.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('link[rel="manifest"]').setAttribute('href', manifestURL);

        // 注册 Service Worker 实现离线缓存能力
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open('novel-ai-v1').then(cache => cache.addAll(['./index.html'])));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swURL = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swURL).catch(err => console.log('SW 注册失败', err));
        }
    </script>
</body>
</html>
